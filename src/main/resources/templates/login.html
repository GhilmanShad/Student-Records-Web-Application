<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Faculty Register</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<main class="login-container">
    <div class="login-card">

        <div class="portal-brand">
            <div class="brand-name">Faculty</div>
            <div class="brand-subtitle">Academic Portal</div>
        </div>

        <h1>Sign In</h1>

        <div class="error-message" th:if="${param.error}">
            Invalid username or password.
        </div>

        <div class="success-message" th:if="${param.logout}">
            You have been logged out successfully.
        </div>

        <div class="success-message" th:if="${param.registered}">
            Account created successfully. Please sign in.
        </div>

        <form th:action="@{/login}" method="post">

            <label for="username">Username</label>

            <div class="input-group">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                    </svg>
                </span>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>

            <small class="field-hint">
                Enter your registered username.
            </small>

            <label for="password">Password</label>

            <div class="input-group">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="10" width="14" height="11" rx="1"/>
                        <path d="M8 10V6a4 4 0 0 1 8 0v4"/>
                    </svg>
                </span>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="current-password"
                       required>
            </div>

            <div class="button-container">
                <button type="submit">
                    Sign In
                </button>
            </div>

        </form>

        <p class="registration-link">
            Don't have an account?
            <a th:href="@{/register}">Create Account</a>
        </p>

        <p class="footer">
            Student Records Management System
        </p>

    </div>
</main>

</body>
</html>
