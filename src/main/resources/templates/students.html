<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student directory · Faculty Register</title>
  <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<header>
    <div class="bar">
        <a class="brand" th:href="@{/students}">
            <span class="mark" aria-hidden="true">R</span>
            Faculty Register
        </a>

        <div class="header-actions">
            <span class="staff">Academic records</span>

            <form th:action="@{/logout}" method="post"
                  class="logout-form">
                <button type="submit" class="logout-btn">
                    Logout
                </button>
            </form>
        </div>
    </div>
</header>
  <main>
    <section class="hero">
      <h1>Faculty Workspace</h1>
    </section>
    <div class="success-notification"
         role="status"
         th:if="${success}"
         th:text="${success}">
    </div>

    <section class="panel" aria-labelledby="records">
      <div class="toolbar">
        <div class="records-heading">
          <h2 id="records">Student Records <span class="count" th:text="${students.size()}"></span></h2>
          <a class="button gold" th:href="@{/students/new}"><span aria-hidden="true">＋</span> Add Student</a>
        </div>
        <form class="search" method="get" th:action="@{/students}">
          <label class="sr" for="keyword">Search student records</label>
          <input id="keyword" name="keyword" type="search" placeholder="Search by name, reg. no. or department…" th:value="${keyword}">
          <button type="submit">Search</button>
          <a class="clear-search" th:hidden="${#strings.isEmpty(keyword)}" th:href="@{/students}">Clear</a>
        </form>
      </div>
      <div id="results">
        <div class="scroll" th:unless="${students.isEmpty()}">
          <table>
            <thead><tr><th>Student name</th><th>Registration number</th><th>Department</th><th>CGPA</th><th>Actions</th></tr></thead>
            <tbody><tr th:each="student : ${students}">
              <td class="person"><a th:href="@{/students/{r}(r=${student.regNo})}" th:text="${student.name}"></a></td>
              <td class="code" th:text="${student.regNo}"></td>
              <td><span class="dept" th:text="${student.department}"></span></td>
              <td class="score" th:text="${#numbers.formatDecimal(student.cgpa,1,2)}"></td>
              <td><div class="actions">
                <a th:href="@{/students/{r}/edit(r=${student.regNo})}">Edit</a></div></td>
            </tr></tbody>
          </table>
        </div>
        <p class="empty" th:if="${students.isEmpty()}">No students found.</p>
      </div>
      <p id="search-status" class="sr" role="status"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('.search');
    const field = form.elements.keyword;
    const clear = form.querySelector('.clear-search');
    const status = document.querySelector('#search-status');
    let pending;
    let timer;

    async function refresh() {
      const request = new AbortController();
      pending = request;
      const url = new URL(form.action);
      if (field.value) url.searchParams.set('keyword', field.value);
      try {
        const response = await fetch(url, {signal: request.signal});
        if (!response.ok) throw new Error('Search failed');
        const page = new DOMParser().parseFromString(await response.text(), 'text/html');
        if (request.signal.aborted) return;
        const results = page.querySelector('#results');
        const count = page.querySelector('#records .count').textContent;
        document.querySelector('#results').replaceChildren(...results.childNodes);
        document.querySelector('#records .count').textContent = count;
        status.className = 'sr';
        status.textContent = count + ' students found.';
        history.replaceState(null, '', url);
      } catch (error) {
        if (request.signal.aborted) return;
        status.className = 'empty';
        status.textContent = 'Could not refresh the list. Press Search to retry.';
      }
    }

    field.addEventListener('input', () => {
      pending?.abort();
      clearTimeout(timer);
      clear.hidden = !field.value;
      timer = setTimeout(refresh, 150);
    });
    clear.addEventListener('click', event => {
      event.preventDefault();
      field.value = '';
      field.dispatchEvent(new Event('input'));
      field.focus();
    });
  </script>
</body>
</html>
